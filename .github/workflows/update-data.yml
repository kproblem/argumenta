name: Update data

on:
  schedule:
    - cron: '0 6,9,17,20 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/update-data.mjs
      - name: Commit changes
        run: |
          git config user.name "data-bot"
          git config user.email "data-bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || (git commit -m "chore(data): update snapshots" && git push)
      - name: Keepalive
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/update-data.yml/enable"
